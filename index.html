<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="K12执行台" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>K12小红书执行台</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --ink: #172033;
    --muted: #65758b;
    --line: #dbe3ef;
    --soft: #f5f7fb;
    --paper: #ffffff;
    --blue: #2563eb;
    --green: #0f9f6e;
    --red: #dc2626;
    --amber: #d97706;
  }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f8fc;
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px 10px;
  }
  h1 { margin: 0; font-size: 19px; line-height: 1.2; }
  .date { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 0 12px 12px;
  }
  .tab {
    min-height: 38px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  main { max-width: 1120px; margin: 0 auto; padding: 14px; }
  section { display: none; }
  section.active { display: block; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
  }
  .span-4 { grid-column: span 4; }
  .span-5 { grid-column: span 5; }
  .span-7 { grid-column: span 7; }
  .span-8 { grid-column: span 8; }
  .span-12 { grid-column: span 12; }
  h2 { margin: 0 0 10px; font-size: 16px; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 13px; }
  button, input, select, textarea {
    font: inherit;
  }
  button {
    border: 0;
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn { background: #eaf0fb; color: #274066; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.green { background: var(--green); color: #fff; }
  .btn.red { background: #fee2e2; color: var(--red); }
  .btn.amber { background: #fef3c7; color: #92400e; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  label { color: var(--muted); font-size: 12px; font-weight: 700; }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    padding: 10px 11px;
    color: var(--ink);
    outline: none;
    font-size: 14px;
  }
  textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .metric {
    display: grid;
    gap: 4px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .metric b { font-size: 22px; }
  .metric span { color: var(--muted); font-size: 12px; }
  .checklist { display: grid; gap: 8px; }
  .check {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .check input { width: 18px; height: 18px; margin: 1px 0 0; }
  .check strong { display: block; font-size: 14px; margin-bottom: 2px; }
  .check small { display: block; color: var(--muted); line-height: 1.45; }
  .cardlist { display: grid; gap: 10px; }
  .item {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    padding: 12px;
  }
  .item-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .item-title { font-weight: 800; font-size: 14px; line-height: 1.4; }
  .tag {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eef2ff;
    color: #3730a3;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .note { margin-top: 8px; padding: 10px; background: var(--soft); border-radius: 7px; color: #344154; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .searchbar { display: grid; grid-template-columns: 1fr 150px; gap: 8px; margin-bottom: 10px; }
  .empty { text-align: center; padding: 28px 10px; color: var(--muted); }
  .composer-title {
    padding: 10px;
    border: 1px dashed #9bb7ed;
    background: #f8fbff;
    border-radius: 7px;
    font-weight: 800;
    line-height: 1.5;
  }
  .install-banner {
    position: fixed;
    left: 14px;
    right: 14px;
    bottom: 14px;
    z-index: 50;
    display: none;
    gap: 10px;
    align-items: center;
    padding: 12px;
    border-radius: 8px;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 12px 30px rgba(20, 32, 54, .18);
  }
  .install-banner.show { display: flex; }
  .install-banner p { flex: 1; }
  @media (max-width: 820px) {
    main { padding: 10px; }
    .grid { grid-template-columns: 1fr; }
    .span-4, .span-5, .span-7, .span-8, .span-12 { grid-column: auto; }
    .split, .searchbar { grid-template-columns: 1fr; }
    .tabs { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div>
      <h1>K12小红书执行台</h1>
      <div class="date" id="todayText"></div>
    </div>
    <button class="btn primary" id="quickPostBtn">生成今日笔记</button>
  </div>
  <nav class="tabs" aria-label="主要功能">
    <button class="tab active" data-tab="today">今日执行</button>
    <button class="tab" data-tab="ideas">选题库</button>
    <button class="tab" data-tab="posts">发布记录</button>
    <button class="tab" data-tab="assets">资料产品</button>
  </nav>
</header>

<main>
  <section id="today" class="active">
    <div class="grid">
      <div class="panel span-8">
        <h2>今天照这个做</h2>
        <div class="checklist" id="dailyChecklist"></div>
      </div>
      <div class="panel span-4">
        <h2>本周数据</h2>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">
          <div class="metric"><b id="mPosts">0</b><span>笔记</span></div>
          <div class="metric"><b id="mSaves">0</b><span>收藏</span></div>
          <div class="metric"><b id="mLeads">0</b><span>咨询</span></div>
          <div class="metric"><b id="mSales">0</b><span>成交</span></div>
        </div>
        <div class="note" id="weekAdvice" style="margin-top:10px"></div>
      </div>
      <div class="panel span-12">
        <h2>笔记生成器</h2>
        <div class="split">
          <div class="field">
            <label>年级</label>
            <select id="genGrade">
              <option>一年级</option><option>二年级</option><option>三年级</option><option>四年级</option>
              <option>五年级</option><option>六年级</option><option>小升初</option><option>初一</option><option>初二</option><option>初三</option>
            </select>
          </div>
          <div class="field">
            <label>科目</label>
            <select id="genSubject">
              <option>数学</option><option>语文</option><option>英语</option><option>科学</option><option>学习习惯</option>
            </select>
          </div>
        </div>
        <div class="split">
          <div class="field">
            <label>内容类型</label>
            <select id="genType">
              <option>资料展示</option><option>痛点解决</option><option>清单合集</option><option>避坑经验</option><option>打卡陪学</option>
            </select>
          </div>
          <div class="field">
            <label>资料主题</label>
            <input id="genTopic" placeholder="如：应用题专项、拼音易错点、英语高频词" />
          </div>
        </div>
        <div class="btnrow">
          <button class="btn primary" onclick="generateDraft()">生成文案</button>
          <button class="btn green" onclick="saveDraftAsPost()">保存到发布记录</button>
        </div>
        <div class="composer-title" id="draftTitle" style="margin-top:12px"></div>
        <textarea id="draftBody" style="margin-top:10px;min-height:230px"></textarea>
      </div>
    </div>
  </section>

  <section id="ideas">
    <div class="grid">
      <div class="panel span-5">
        <h2>新增选题</h2>
        <div class="field"><label>标题/方向</label><input id="ideaTitle" placeholder="如：二年级数学单位换算打印资料" /></div>
        <div class="split">
          <div class="field"><label>年级</label><input id="ideaGrade" placeholder="二年级" /></div>
          <div class="field"><label>科目</label><input id="ideaSubject" placeholder="数学" /></div>
        </div>
        <div class="field"><label>家长痛点</label><textarea id="ideaPain" placeholder="孩子哪里容易错，家长为什么需要这份资料"></textarea></div>
        <button class="btn primary" onclick="addIdea()">加入选题库</button>
      </div>
      <div class="panel span-7">
        <h2>选题库</h2>
        <div class="searchbar">
          <input id="ideaSearch" placeholder="搜索年级、科目、痛点" oninput="renderIdeas()" />
          <select id="ideaStatus" onchange="renderIdeas()">
            <option value="">全部状态</option><option>待制作</option><option>已发布</option><option>效果好</option>
          </select>
        </div>
        <div class="cardlist" id="ideaList"></div>
      </div>
    </div>
  </section>

  <section id="posts">
    <div class="grid">
      <div class="panel span-5">
        <h2>记录一篇笔记</h2>
        <div class="field"><label>标题</label><input id="postTitle" /></div>
        <div class="split">
          <div class="field"><label>年级/科目</label><input id="postSegment" placeholder="二年级 数学" /></div>
          <div class="field"><label>发布日期</label><input id="postDate" type="date" /></div>
        </div>
        <div class="split">
          <div class="field"><label>收藏</label><input id="postSaves" type="number" min="0" value="0" /></div>
          <div class="field"><label>评论</label><input id="postComments" type="number" min="0" value="0" /></div>
        </div>
        <div class="split">
          <div class="field"><label>私信/咨询</label><input id="postLeads" type="number" min="0" value="0" /></div>
          <div class="field"><label>成交</label><input id="postSales" type="number" min="0" value="0" /></div>
        </div>
        <div class="field"><label>复盘</label><textarea id="postReview" placeholder="什么封面、标题、资料类型有效"></textarea></div>
        <button class="btn primary" onclick="addPost()">保存记录</button>
      </div>
      <div class="panel span-7">
        <h2>发布记录</h2>
        <div class="cardlist" id="postList"></div>
      </div>
    </div>
  </section>

  <section id="assets">
    <div class="grid">
      <div class="panel span-5">
        <h2>新增资料产品</h2>
        <div class="field"><label>资料名称</label><input id="assetName" placeholder="如：二年级数学应用题30天" /></div>
        <div class="split">
          <div class="field"><label>定价</label><input id="assetPrice" placeholder="19.9" /></div>
          <div class="field"><label>状态</label><select id="assetStatus"><option>制作中</option><option>可销售</option><option>需优化</option></select></div>
        </div>
        <div class="field"><label>卖点</label><textarea id="assetPitch" placeholder="解决什么问题，适合什么孩子，怎么使用"></textarea></div>
        <button class="btn primary" onclick="addAsset()">保存资料</button>
      </div>
      <div class="panel span-7">
        <h2>资料产品库</h2>
        <div class="cardlist" id="assetList"></div>
      </div>
      <div class="panel span-12">
        <h2>合规提醒</h2>
        <p>内容定位为资料整理、家长陪学、学习习惯和练习工具。避免使用“保提分、押题、内部资料、名师培训、学科辅导、一对一”等表达；资料必须原创、授权或来自可合法使用来源。</p>
      </div>
    </div>
  </section>
</main>

<div class="install-banner" id="installBanner">
  <p><b>安装到手机桌面</b><br />可以像 App 一样打开，资料和记录保存在本机浏览器。</p>
  <button class="btn primary" id="installBtn">安装</button>
  <button class="btn" onclick="hideInstall()">关闭</button>
</div>

<script>
const KEY = "k12_xhs_executor_v1";
const state = loadState();

function defaultState() {
  return {
    checks: {},
    ideas: [
      { id: uid(), title: "一年级拼音易错点打印资料", grade: "一年级", subject: "语文", pain: "声母韵母混淆，家长不知道每天练什么", status: "待制作" },
      { id: uid(), title: "二年级数学应用题分类练习", grade: "二年级", subject: "数学", pain: "孩子读不懂题，容易漏条件", status: "待制作" },
      { id: uid(), title: "小升初英语高频词主题表", grade: "小升初", subject: "英语", pain: "词汇散乱，背了容易忘", status: "待制作" }
    ],
    posts: [],
    assets: [
      { id: uid(), name: "二年级数学应用题30天", price: "19.9", status: "制作中", pitch: "每天一页，按题型分类，适合家长陪孩子查漏补缺。" }
    ]
  };
}
function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || defaultState(); }
  catch { return defaultState(); }
}
function saveState() {
  localStorage.setItem(KEY, JSON.stringify(state));
  renderAll();
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
}

const tasks = [
  ["选题", "从选题库挑 1 个细分主题，只服务一个年级和一个痛点。"],
  ["做图", "做 6-9 张图：封面、目录、3 张内页、使用方法、合集引导。"],
  ["发文", "发布 1-2 篇笔记，标题像家长经验分享，不要像广告。"],
  ["互动", "回复评论，优先问年级、科目、孩子卡点。"],
  ["记录", "把收藏、评论、咨询、成交写进发布记录。"]
];

function renderChecks() {
  const day = todayISO();
  state.checks[day] ||= {};
  document.getElementById("dailyChecklist").innerHTML = tasks.map(([name, desc], i) => `
    <label class="check">
      <input type="checkbox" ${state.checks[day][i] ? "checked" : ""} onchange="toggleCheck(${i}, this.checked)" />
      <span><strong>${name}</strong><small>${desc}</small></span>
    </label>
  `).join("");
}
function toggleCheck(i, checked) {
  const day = todayISO();
  state.checks[day] ||= {};
  state.checks[day][i] = checked;
  saveState();
}

function generateDraft() {
  const grade = document.getElementById("genGrade").value;
  const subject = document.getElementById("genSubject").value;
  const type = document.getElementById("genType").value;
  const topic = document.getElementById("genTopic").value.trim() || "易错专项练习";
  const titles = {
    "资料展示": `${grade}${subject}${topic}，我整理成打印版了`,
    "痛点解决": `孩子${topic}总出错，先别急着刷难题`,
    "清单合集": `${grade}${subject}资料清单，家长打印就能用`,
    "避坑经验": `${grade}家长别盲目刷题，${subject}先抓这件事`,
    "打卡陪学": `每天10分钟，${grade}${subject}${topic}打卡`
  };
  const body = `最近整理${grade}${subject}资料时，发现很多孩子卡在「${topic}」这里。

这份资料适合：
1. 基础会一点，但一做题就容易错的孩子
2. 家长想陪练，但不知道每天练什么
3. 期末前想系统过一遍易错点

资料内容：
1. 高频易错点
2. 分类练习
3. 答案和订正位置
4. 每天一页的使用安排

建议用法：
每天先做 10-15 分钟，做完一定要订正错题。不要只追求刷完，重点看孩子错在哪里。

需要哪类资料，可以在评论区说年级+科目，我按需求继续整理。`;
  document.getElementById("draftTitle").textContent = titles[type];
  document.getElementById("draftBody").value = body;
}
function saveDraftAsPost() {
  const title = document.getElementById("draftTitle").textContent.trim();
  if (!title) { alert("先生成一篇笔记"); return; }
  state.posts.unshift({
    id: uid(),
    title,
    segment: `${document.getElementById("genGrade").value} ${document.getElementById("genSubject").value}`,
    date: todayISO(),
    saves: 0,
    comments: 0,
    leads: 0,
    sales: 0,
    review: "待发布/待复盘"
  });
  saveState();
  switchTab("posts");
}

function addIdea() {
  const title = document.getElementById("ideaTitle").value.trim();
  if (!title) { alert("先写一个选题"); return; }
  state.ideas.unshift({
    id: uid(),
    title,
    grade: document.getElementById("ideaGrade").value.trim(),
    subject: document.getElementById("ideaSubject").value.trim(),
    pain: document.getElementById("ideaPain").value.trim(),
    status: "待制作"
  });
  ["ideaTitle","ideaGrade","ideaSubject","ideaPain"].forEach(id => document.getElementById(id).value = "");
  saveState();
}
function renderIdeas() {
  const q = document.getElementById("ideaSearch")?.value.trim().toLowerCase() || "";
  const status = document.getElementById("ideaStatus")?.value || "";
  const rows = state.ideas.filter(x => (!status || x.status === status) && (!q || `${x.title} ${x.grade} ${x.subject} ${x.pain}`.toLowerCase().includes(q)));
  document.getElementById("ideaList").innerHTML = rows.length ? rows.map(x => `
    <div class="item">
      <div class="item-head"><div class="item-title">${esc(x.title)}</div><span class="tag">${esc(x.status)}</span></div>
      <div class="meta">${esc(x.grade || "-")} / ${esc(x.subject || "-")}</div>
      <div class="note">${esc(x.pain || "还没有写痛点")}</div>
      <div class="btnrow" style="margin-top:10px">
        <button class="btn" onclick="useIdea('${x.id}')">拿去生成</button>
        <button class="btn amber" onclick="cycleIdea('${x.id}')">改状态</button>
        <button class="btn red" onclick="deleteItem('ideas','${x.id}')">删除</button>
      </div>
    </div>
  `).join("") : `<div class="empty">还没有匹配的选题</div>`;
}
function useIdea(id) {
  const x = state.ideas.find(v => v.id === id);
  if (!x) return;
  document.getElementById("genGrade").value = [...document.getElementById("genGrade").options].some(o => o.value === x.grade) ? x.grade : "二年级";
  document.getElementById("genSubject").value = [...document.getElementById("genSubject").options].some(o => o.value === x.subject) ? x.subject : "数学";
  document.getElementById("genTopic").value = x.title.replace(x.grade, "").replace(x.subject, "").trim();
  switchTab("today");
  generateDraft();
}
function cycleIdea(id) {
  const x = state.ideas.find(v => v.id === id);
  const list = ["待制作", "已发布", "效果好"];
  x.status = list[(list.indexOf(x.status) + 1) % list.length];
  saveState();
}

function addPost() {
  const title = document.getElementById("postTitle").value.trim();
  if (!title) { alert("先写标题"); return; }
  state.posts.unshift({
    id: uid(),
    title,
    segment: document.getElementById("postSegment").value.trim(),
    date: document.getElementById("postDate").value || todayISO(),
    saves: Number(document.getElementById("postSaves").value || 0),
    comments: Number(document.getElementById("postComments").value || 0),
    leads: Number(document.getElementById("postLeads").value || 0),
    sales: Number(document.getElementById("postSales").value || 0),
    review: document.getElementById("postReview").value.trim()
  });
  ["postTitle","postSegment","postReview"].forEach(id => document.getElementById(id).value = "");
  ["postSaves","postComments","postLeads","postSales"].forEach(id => document.getElementById(id).value = 0);
  saveState();
}
function renderPosts() {
  document.getElementById("postList").innerHTML = state.posts.length ? state.posts.map(x => `
    <div class="item">
      <div class="item-head"><div class="item-title">${esc(x.title)}</div><span class="tag">${esc(x.date)}</span></div>
      <div class="meta">${esc(x.segment || "-")} | 收藏 ${x.saves} | 评论 ${x.comments} | 咨询 ${x.leads} | 成交 ${x.sales}</div>
      <div class="note">${esc(x.review || "还没有复盘")}</div>
      <div class="btnrow" style="margin-top:10px"><button class="btn red" onclick="deleteItem('posts','${x.id}')">删除</button></div>
    </div>
  `).join("") : `<div class="empty">发布后在这里记录数据</div>`;
}

function addAsset() {
  const name = document.getElementById("assetName").value.trim();
  if (!name) { alert("先写资料名称"); return; }
  state.assets.unshift({
    id: uid(),
    name,
    price: document.getElementById("assetPrice").value.trim(),
    status: document.getElementById("assetStatus").value,
    pitch: document.getElementById("assetPitch").value.trim()
  });
  ["assetName","assetPrice","assetPitch"].forEach(id => document.getElementById(id).value = "");
  saveState();
}
function renderAssets() {
  document.getElementById("assetList").innerHTML = state.assets.length ? state.assets.map(x => `
    <div class="item">
      <div class="item-head"><div class="item-title">${esc(x.name)}</div><span class="tag">${esc(x.status)}</span></div>
      <div class="meta">定价：${esc(x.price || "-")}</div>
      <div class="note">${esc(x.pitch || "还没有写卖点")}</div>
      <div class="btnrow" style="margin-top:10px"><button class="btn red" onclick="deleteItem('assets','${x.id}')">删除</button></div>
    </div>
  `).join("") : `<div class="empty">把能卖的资料包放到这里</div>`;
}

function deleteItem(bucket, id) {
  if (!confirm("确定删除这条记录吗？")) return;
  state[bucket] = state[bucket].filter(x => x.id !== id);
  saveState();
}
function renderMetrics() {
  const weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 6);
  const rows = state.posts.filter(x => new Date(x.date) >= new Date(weekAgo.toISOString().slice(0,10)));
  const sum = k => rows.reduce((n, x) => n + Number(x[k] || 0), 0);
  document.getElementById("mPosts").textContent = rows.length;
  document.getElementById("mSaves").textContent = sum("saves");
  document.getElementById("mLeads").textContent = sum("leads");
  document.getElementById("mSales").textContent = sum("sales");
  const advice = rows.length < 7
    ? "本周先把发布量做起来：每天至少 1 篇资料展示，数据少时不要急着判断方向。"
    : sum("leads") > 0
      ? "已经有咨询了，优先复盘带来咨询的标题和资料类型，连续加发 3 篇同方向。"
      : "有发布但咨询少，下一步加强封面目录、资料内页展示和评论区互动。";
  document.getElementById("weekAdvice").textContent = advice;
}
function renderAll() {
  renderChecks();
  renderIdeas();
  renderPosts();
  renderAssets();
  renderMetrics();
}
function switchTab(id) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("active", s.id === id));
}
document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
document.getElementById("quickPostBtn").addEventListener("click", () => { switchTab("today"); generateDraft(); });
document.getElementById("postDate").value = todayISO();
document.getElementById("todayText").textContent = new Date().toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
generateDraft();
renderAll();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
let deferredPrompt;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").classList.add("show");
});
document.getElementById("installBtn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  hideInstall();
});
function hideInstall() { document.getElementById("installBanner").classList.remove("show"); }
</script>
</body>
</html>
